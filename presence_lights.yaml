blueprint:
  name: Presence lights (motion + Frigate, after dark or bad weather)
  description: |-
    Turn lights on when someone is there and off again once everyone has left. Combine as many presence sensors as you like: motion sensors, camera person detection or Frigate person occupancy.

    **How it works:**
    - **On:** as soon as *any* sensor detects someone, but only after sunset, or during the day when the weather is bad (optional). You can also let it turn on at any time of day
    - **Off:** once *every* sensor has been clear for the off delay (5 minutes by default)
    - **Never stuck on:** turning off doesn't depend on the time or the weather, so lights that came on at night or in the rain still turn off after sunrise or when the rain stops

    **Bad weather (optional):** pick a weather entity and choose which conditions count as dark enough, such as rain, snow or hail. The weather is only checked when someone arrives.

    Works with lights and switches. Requires Home Assistant 2024.10 or newer.
  domain: automation
  input:
    presence_sensors:
      name: Presence sensors
      description: Motion, occupancy and Frigate person sensors. Any one "on" turns the lights on.
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor
    target_lights:
      name: Lights
      description: Lights or switches to control.
      selector:
        target:
    off_delay:
      name: Off delay
      description: How long every sensor must be clear before the lights turn off.
      default:
        hours: 0
        minutes: 5
        seconds: 0
      selector:
        duration:
    only_when_dark:
      name: Only when dark or bad weather
      description: When enabled, lights only turn on after sunset or in bad weather.
      default: true
      selector:
        boolean:
    weather_entity:
      name: Weather entity
      description: Optional. Leave empty to ignore the weather.
      default: ""
      selector:
        entity:
          filter:
            - domain: weather
    bad_weather_states:
      name: Bad weather states
      description: Weather states that count as bad weather.
      default:
        - rainy
        - pouring
        - lightning-rainy
        - snowy-rainy
        - snowy
        - hail
      selector:
        select:
          multiple: true
          custom_value: true
          options:
            - rainy
            - pouring
            - lightning-rainy
            - snowy-rainy
            - snowy
            - hail
            - fog
            - cloudy

mode: restart
max_exceeded: silent

variables:
  presence_sensors: !input presence_sensors
  off_delay: !input off_delay
  only_when_dark: !input only_when_dark
  weather_entity: !input weather_entity
  bad_weather_states: !input bad_weather_states
  off_delay_seconds: >-
    {{ (off_delay.hours | default(0) | int) * 3600
       + (off_delay.minutes | default(0) | int) * 60
       + (off_delay.seconds | default(0) | int) }}

triggers:
  - trigger: state
    entity_id: !input presence_sensors
    to: "on"
    id: presence
  # Also fires when a sensor drops to unavailable/unknown, so an offline
  # camera can't leave the light stuck on.
  - trigger: state
    entity_id: !input presence_sensors
    to:
      - "off"
      - unavailable
      - unknown
    for: !input off_delay
    id: clear

conditions: []

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: presence
          - condition: template
            value_template: >-
              {% set dark = is_state('sun.sun', 'below_horizon') %}
              {% set bad_weather = weather_entity not in ['', none]
                 and states(weather_entity) in bad_weather_states %}
              {{ (not only_when_dark) or dark or bad_weather }}
        sequence:
          - action: homeassistant.turn_on
            target: !input target_lights
      - conditions:
          - condition: trigger
            id: clear
          - alias: No sensor is on, and none changed state within the off delay
            condition: template
            value_template: >-
              {% set sensors = expand(presence_sensors) %}
              {% set cutoff = now() - timedelta(seconds=(off_delay_seconds | int) - 2) %}
              {{ sensors | selectattr('state', 'eq', 'on') | list | count == 0
                 and sensors | selectattr('last_changed', 'gt', cutoff) | list | count == 0 }}
        sequence:
          - action: homeassistant.turn_off
            target: !input target_lights
